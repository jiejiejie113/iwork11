# iwork 本地局域网反代配置（仅 local 环境使用）
# 由 docker-compose.proxy.yml 挂载，作为 DKT_iwork 的前置访问入口；
# DKT_iwork 容器的 8000 端口仍只暴露在 docker_dkt-net 内，不映射宿主机。
# 注意：本配置为本地开发访问注入固定身份（视为已登录管理员），
# 仅适用于内网开发环境，生产部署不包含本文件。
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream iwork_backend {
        server DKT_iwork:8000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://iwork_backend;
            proxy_http_version 1.1;
            # 透传原始 Host（如 192.168.30.191:8000），
            # Django 侧 ALLOWED_HOSTS 已放行该地址。
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 取消登录限制：为本地局域网访客注入固定身份（admin 组），
            # 应用层 TrustedProxyMiddleware 仍校验来源，仅本反代可达。
            proxy_set_header Remote-Subject "local-anonymous";
            proxy_set_header Remote-User "anonymous";
            proxy_set_header Remote-Name "LAN Visitor";
            proxy_set_header Remote-Groups "admin";
            # SSE 实时推送需要关闭缓冲并放宽读写超时。
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}