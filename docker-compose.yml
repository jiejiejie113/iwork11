services:
  iwork:
    build: .
    container_name: DKT_iwork
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ${IWORK_RELEASE_PROFILE_FILE:-./env/${DKT_ENVIRONMENT:-production}.env}
    environment:
      DJANGO_SECRET_KEY: ${IWORK_DJANGO_SECRET_KEY:?Set IWORK_DJANGO_SECRET_KEY in dkt-secrets.env}
      ACCESS_DB_PASSWORD: ${IWORK_APP_DB_PASSWORD:?Set IWORK_APP_DB_PASSWORD in dkt-secrets.env}
      LOCAL_DB_PASSWORD: ${IWORK_APP_DB_PASSWORD:?Set IWORK_APP_DB_PASSWORD in dkt-secrets.env}
      IWORK_DB_PASSWORD: ${IWORK_DB_PASSWORD:?Set IWORK_DB_PASSWORD in dkt-secrets.env}
    volumes:
      - ./logs:/app/logs
      - ./sqlite:/app/sqlite:ro
      - ./static:/app/static
    networks:
      - dkt-net
    healthcheck:
      # 与 Rebuild-Local.ps1 的 Wait-IworkReady 同一探法；start_period 需覆盖迁移与静态收集
      test:
        - CMD-SHELL
        - >-
          python -c "import http.client,sys; conn=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); conn.request('GET','/',headers={'Host':'iwork','Connection':'close'}); status=conn.getresponse().status; conn.close(); sys.exit(0 if status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  alert-worker:
    build: .
    container_name: DKT_iwork_alert_worker
    restart: unless-stopped
    env_file:
      - ${IWORK_RELEASE_PROFILE_FILE:-./env/${DKT_ENVIRONMENT:-production}.env}
    environment:
      IWORK_CONTAINER_ROLE: alert-worker
      DJANGO_SECRET_KEY: ${IWORK_DJANGO_SECRET_KEY:?Set IWORK_DJANGO_SECRET_KEY in dkt-secrets.env}
      ACCESS_DB_PASSWORD: ${IWORK_APP_DB_PASSWORD:?Set IWORK_APP_DB_PASSWORD in dkt-secrets.env}
      LOCAL_DB_PASSWORD: ${IWORK_APP_DB_PASSWORD:?Set IWORK_APP_DB_PASSWORD in dkt-secrets.env}
      IWORK_DB_PASSWORD: ${IWORK_DB_PASSWORD:?Set IWORK_DB_PASSWORD in dkt-secrets.env}
    volumes:
      - ./logs:/app/logs
    networks:
      - dkt-net
    depends_on:
      - iwork
    healthcheck:
      test: ["CMD-SHELL", "celery -A iwork inspect ping -d alerts@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dkt-net:
    external: true
    name: docker_dkt-net
