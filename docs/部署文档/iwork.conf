# iwork Nginx 参考配置（SSE）
# 生产环境权威配置位于：
# DTD_nginx/docker/nginx-keycloak/site-confs/apps/iwork.conf

location = /iwork {
    return 301 /iwork/;
}

location /iwork/ {
    include /etc/nginx/snippets/oauth2-authrequest.conf;
    include /etc/nginx/snippets/proxy.conf;

    proxy_pass http://DKT_iwork:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # SSE 必需：禁止响应缓冲，并允许长连接跨过采集周期。
    proxy_buffering off;
    proxy_read_timeout 120s;

    add_header Cache-Control "no-store, must-revalidate";
    client_max_body_size 10m;
}

# 当前架构没有 /ws/、WebSocket Upgrade 或 Daphne upstream。
