# ==============================================
# iwork Dashboard — Nginx 反向代理配置
# 部署方式: 将此文件放入 Nginx conf.d/ 目录, 替换域名为实际值, 然后 nginx -s reload
# ==============================================

# ---------- 上游定义 ----------
upstream iwork_daphne {
    server 127.0.0.1:8000;
    # 如有多实例可添加:
    # server 127.0.0.1:8001;
    # least_conn;
}

# ---------- HTTP (80) ----------
server {
    listen 80;
    server_name your-domain.com;   # <-- 替换为实际域名或 IP

    # 强制跳转 HTTPS（如需启用，取消下面注释）
    # return 301 https://$host$request_uri;

    # ---------- 日志 ----------
    access_log logs/iwork_access.log;
    error_log  logs/iwork_error.log;

    # ---------- 静态文件 ----------
    location /static/ {
        alias D:/iwork/staticfiles/;   # <-- 替换为实际 collectstatic 输出目录
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- API + 页面 ----------
    location / {
        proxy_pass http://iwork_daphne;

        # 基础头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（部分查询需要较长时间）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 禁用缓冲（SSE/流式响应兼容）
        proxy_buffering off;

        # 最大上传
        client_max_body_size 10m;
    }

    # ---------- WebSocket (Channels) ----------
    location /ws/ {
        proxy_pass http://iwork_daphne;

        # WebSocket 升级必需头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

