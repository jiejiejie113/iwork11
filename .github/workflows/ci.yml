name: iwork CI
run-name: >-
  iwork ci · ${{ inputs.request_id }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 本次触发的唯一关联ID
        required: true
        type: string

# ======
# 完整 CI 的并发与最小权限
concurrency:
  group: iwork-ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

# ======
# 完整 CI 检查 Job
jobs:
  test:
    name: Python测试与静态检查
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 校验请求关联ID和运行身份
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'GuChenkano/iwork') {
              throw 'CI只能在受信仓库运行。'
          }
          if ($env:GITHUB_REF -cne 'refs/heads/Keycloak') {
              throw '完整CI只能在Keycloak分支运行。'
          }
          if ($env:REQUEST_ID -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') {
              throw 'Invalid request ID format.'
          }
          @(
              '## iwork CI审计摘要'
              ''
              "- Repository: $env:GITHUB_REPOSITORY"
              "- Ref: $env:GITHUB_REF"
              "- Commit: $env:GITHUB_SHA"
              "- Actor: $env:GITHUB_ACTOR"
              "- Request ID: $env:REQUEST_ID"
              "- Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          "IWORK_REQUEST_ID=$env:REQUEST_ID"

      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 删除临时测试工作区中的根环境文件
        shell: pwsh
        run: if (Test-Path -LiteralPath .env) { Remove-Item -LiteralPath .env -Force }

      - name: 校验Compose配置
        shell: pwsh
        env:
          DKT_ENVIRONMENT: local
          IWORK_DJANGO_SECRET_KEY: ci-only-django-secret
          IWORK_APP_DB_PASSWORD: ci-only-app-password
          IWORK_DB_PASSWORD: ci-only-read-password
        run: docker compose --env-file env/local.env config --quiet

      - name: 配置Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: 安装测试依赖
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-ci.txt

      - name: 检查生产Python包
        shell: pwsh
        run: python -m ruff check --no-cache --ignore E402,W292 iwork

      - name: 检查迁移文件同步状态
        shell: pwsh
        run: python manage.py makemigrations --check --dry-run --settings=iwork.test_settings

      - name: 运行隔离测试
        shell: pwsh
        run: python -m pytest tests/ -q

      - name: 运行PowerShell脚本测试
        shell: pwsh
        run: |
          & ./tests/test_sync_production_orders.ps1
          if ($LASTEXITCODE -ne 0) { throw "同步脚本测试失败" }
          & ./tests/test_install_production_orders_sync_task.ps1
          if ($LASTEXITCODE -ne 0) { throw "计划任务脚本测试失败" }
          & ./tests/test_install_dkt_cicd_skill.ps1
          if ($LASTEXITCODE -ne 0) { throw "dkt-cicd Skill安装测试失败" }
          & ./tools/skills/dkt-cicd/tests/Test-DktCicd.ps1
          if ($LASTEXITCODE -ne 0) { throw "dkt-cicd Skill行为测试失败" }

      - name: 记录CI结果摘要
        if: always()
        shell: pwsh
        run: |
          @(
              ''
              '- Result: determined by GitHub Actions job conclusion'
              "- Completed at: $([DateTimeOffset]::UtcNow.ToString('o'))"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
