name: iwork production runner smoke

on:
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: production-runner-validation-iwork
  cancel-in-progress: false

jobs:
  validate:
    name: 验证iwork Runner与GHCR只读拉取
    if: >-
      github.actor == 'GuChenkano' &&
      github.ref == 'refs/heads/Keycloak'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - dkt-prod
      - iwork
    environment: production-runner-validation
    timeout-minutes: 12
    permissions:
      packages: read
    env:
      IMAGE_REF: ghcr.io/guchenkano/iwork@sha256:2d636c8e09f11667039e3322c6422bea870ebd577dfa1e6686c36b157009390c
      EXPECTED_REVISION: 51c1911e867c7183eef45b66b7fa6bc35ee8d676
    steps:
      - name: 验证执行身份、独立工作目录与Docker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          chcp 65001 | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          if ($identity -ne 'DONGMING\shuju') {
              throw "Unexpected runner identity: $identity"
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          foreach ($forbiddenRoot in @('D:\DM\iwork', 'D:\DM\DTD_nginx')) {
              if ($workspace.StartsWith($forbiddenRoot, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Runner workspace overlaps production repository: $workspace"
              }
          }

          $dockerInfo = docker info --format 'Server={{.ServerVersion}};OSType={{.OSType}};Containers={{.Containers}};Running={{.ContainersRunning}}'
          if ($LASTEXITCODE -ne 0) {
              throw "Docker API is unavailable"
          }
          "Runner identity: $identity"
          "Runner workspace: $workspace"
          "Docker info: $dockerInfo"

      - name: 诊断GitHub与GHCR短期令牌授权边界
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          chcp 65001 | Out-Null
          if ([String]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
              throw "[DEBUG-ghcr-auth] GitHub token is empty"
          }

          "[DEBUG-ghcr-auth] token_length=$($env:GITHUB_TOKEN.Length)"
          $apiHeaders = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GITHUB_TOKEN"
              "User-Agent" = "iwork-production-runner-smoke"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          try {
              $apiResponse = Invoke-WebRequest `
                  -UseBasicParsing `
                  -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY" `
                  -Headers $apiHeaders
              "[DEBUG-ghcr-auth] github_api_status=$([int]$apiResponse.StatusCode)"
          }
          catch {
              $statusCode = [int]$_.Exception.Response.StatusCode
              throw "[DEBUG-ghcr-auth] GitHub API rejected token: status=$statusCode"
          }

          $basicValue = "$env:GITHUB_ACTOR`:$env:GITHUB_TOKEN"
          $basicToken = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($basicValue))
          $ghcrHeaders = @{
              Accept = "application/json"
              Authorization = "Basic $basicToken"
              "User-Agent" = "iwork-production-runner-smoke"
          }
          $scope = [Uri]::EscapeDataString("repository:guchenkano/iwork:pull")
          try {
              $ghcrResponse = Invoke-WebRequest `
                  -UseBasicParsing `
                  -Uri "https://ghcr.io/token?service=ghcr.io&scope=$scope" `
                  -Headers $ghcrHeaders
              if ($ghcrResponse.Content -notmatch '"token"') {
                  throw "[DEBUG-ghcr-auth] GHCR response did not contain a registry token"
              }
              "[DEBUG-ghcr-auth] ghcr_token_status=$([int]$ghcrResponse.StatusCode)"
          }
          catch {
              $statusCode = [int]$_.Exception.Response.StatusCode
              throw "[DEBUG-ghcr-auth] GHCR rejected token: status=$statusCode"
          }
          finally {
              Remove-Variable basicValue, basicToken, ghcrHeaders -ErrorAction SilentlyContinue
          }

      - name: 使用短期令牌按Digest拉取并复验镜像
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          chcp 65001 | Out-Null
          $env:DOCKER_CONFIG = Join-Path $env:RUNNER_TEMP "docker-config-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $env:DOCKER_CONFIG -Force | Out-Null
          $basicValue = "$env:GITHUB_ACTOR`:$env:GITHUB_TOKEN"
          $encodedAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($basicValue))
          $dockerConfig = @{
              auths = @{
                  "ghcr.io" = @{
                      auth = $encodedAuth
                  }
              }
          } | ConvertTo-Json -Depth 4 -Compress
          $configPath = Join-Path $env:DOCKER_CONFIG "config.json"
          [IO.File]::WriteAllText($configPath, $dockerConfig, [Text.UTF8Encoding]::new($false))
          try {
              docker pull $env:IMAGE_REF
              if ($LASTEXITCODE -ne 0) {
                  throw "GHCR digest pull failed"
              }
              $labelsJson = docker image inspect $env:IMAGE_REF --format '{{json .Config.Labels}}'
              if ($LASTEXITCODE -ne 0) {
                  throw "OCI labels inspect failed"
              }
              $labels = $labelsJson | ConvertFrom-Json
              $revision = $labels.'org.opencontainers.image.revision'
              if ([String]::IsNullOrWhiteSpace($revision) -or $revision.Trim() -ne $env:EXPECTED_REVISION) {
                  throw "OCI revision mismatch"
              }
              "Verified immutable image: $env:IMAGE_REF"
          }
          finally {
              Remove-Variable basicValue, encodedAuth, dockerConfig -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $env:DOCKER_CONFIG -Recurse -Force -ErrorAction SilentlyContinue
          }
