name: iwork PR轻量检查

# Pull Request 仅执行轻量检查，不触发完整 CI。
on:
  pull_request:
    branches:
      - Keycloak

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PR轻量静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 配置Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装静态检查依赖
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: 运行Ruff静态检查
        shell: pwsh
        run: python -m ruff check --no-cache --ignore E402,W292 iwork
