name: iwork controlled production deployment
run-name: >-
  iwork ${{ inputs.apply && 'deploy' || 'preflight' }} ·
  ${{ inputs.expected_revision }} ·
  ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 本次触发的唯一关联ID
        required: true
        type: string
      image_digest:
        description: GHCR镜像Digest（sha256:加64位小写十六进制）
        required: true
        type: string
      config_digest:
        description: 不可变生产配置包逻辑Digest（sha256:加64位小写十六进制）
        required: true
        type: string
      config_artifact_digest:
        description: GitHub配置Artifact存储Digest（sha256:加64位小写十六进制）
        required: true
        type: string
      release_run_id:
        description: 成功Release Run的数据库ID
        required: true
        type: string
      release_run_attempt:
        description: 成功Release Run的尝试次数
        required: true
        type: string
      config_artifact_id:
        description: Release引用的配置Artifact ID
        required: true
        type: string
      config_artifact_name:
        description: Release引用的配置Artifact名称
        required: true
        type: string
      manifest_artifact_id:
        description: Release Manifest Artifact ID
        required: true
        type: string
      manifest_artifact_name:
        description: Release Manifest Artifact名称
        required: true
        type: string
      manifest_artifact_digest:
        description: Release Manifest Artifact存储Digest
        required: true
        type: string
      expected_revision:
        description: 镜像OCI revision（40位Commit SHA）
        required: true
        type: string
      preflight_run_id:
        description: 成功apply=false预检Run标识（workflow_run_id-run_attempt；正式部署必填）
        required: false
        default: none
        type: string
      preflight_request_id:
        description: 成功预检Run的request_id（正式部署必填）
        required: false
        default: none
        type: string
      release_request_id:
        description: 成功Release Run的request_id（预检和正式部署必填）
        required: true
        type: string
      apply:
        description: 执行生产容器切换；关闭时只拉取并验证镜像，不切换容器
        required: true
        default: false
        type: boolean
      rollback_drill:
        description: 仅执行一次受控回滚演练；必须同时启用生产容器切换并关闭迁移
        required: true
        default: false
        type: boolean
      run_migrations:
        description: 切换时允许新容器执行数据库迁移
        required: true
        default: false
        type: boolean
      change_description:
        description: 本次预检或部署说明
        required: true
        type: string
      confirmation:
        description: 预检输入PREFLIGHT IWORK；部署按是否迁移输入DEPLOY IWORK或DEPLOY IWORK WITH MIGRATIONS
        required: true
        type: string

permissions:
  contents: none

concurrency:
  group: production-deploy-iwork
  cancel-in-progress: false

jobs:
  deploy:
    name: iwork生产预检与受控部署
    runs-on:
      - self-hosted
      - Windows
      - X64
      - dkt-prod
      - iwork
    environment: production-iwork
    timeout-minutes: 20
    permissions:
      actions: read
      packages: read
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      CONFIG_DIGEST: ${{ inputs.config_digest }}
      CONFIG_ARTIFACT_DIGEST: ${{ inputs.config_artifact_digest }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
      CONFIG_ARTIFACT_ID: ${{ inputs.config_artifact_id }}
      CONFIG_ARTIFACT_NAME: ${{ inputs.config_artifact_name }}
      MANIFEST_ARTIFACT_ID: ${{ inputs.manifest_artifact_id }}
      MANIFEST_ARTIFACT_NAME: ${{ inputs.manifest_artifact_name }}
      MANIFEST_ARTIFACT_DIGEST: ${{ inputs.manifest_artifact_digest }}
      CONFIG_BUNDLE_PATH: ${{ github.workspace }}\iwork-production-config
      REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      PREFLIGHT_REQUEST_ID: ${{ inputs.preflight_request_id }}
      RELEASE_REQUEST_ID: ${{ inputs.release_request_id }}
      APPLY: ${{ inputs.apply }}
      ROLLBACK_DRILL: ${{ inputs.rollback_drill }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations }}
      CHANGE_DESCRIPTION: ${{ inputs.change_description }}
      CONFIRMATION: ${{ inputs.confirmation }}
      WATCHDOG_SHA256: e59f057be2cd427fb7633da22d6220e1167467fa4d3a707a47fd6414edfb0c53
      WATCHDOG_MANIFEST_PATH: D:\DM\DTD_nginx\scripts\docker-health-watchdog.manifest.json
      # 该字节哈希对应受控DONGMING主机上固定安装的Docker看门狗机制清单，
      # 用于绑定SYSTEM恢复脚本、共享Mutex和执行身份；它不是六项外部探针收据。
      # 清单缺失或哈希不匹配时必须失败关闭，不能由dispatch输入替换。
      WATCHDOG_MANIFEST_SHA256: a031d4a8f600bfeb15f15f05e4c626538a4ba7e218014c0ebef48d5f9c39cea2
      WATCHDOG_TASK_NAME: Docker-Health-Watchdog
      WATCHDOG_TASK_PATH: \
      EXTERNAL_PROBE_RECEIPT_PATH: D:\DM\cicd-state\iwork\external-probe-receipt.json
      DEPLOY_SCRIPT_PATH: D:\DM\cicd-tools\iwork\Invoke-IworkProductionDeployment.ps1
      DEPLOY_SCRIPT_SHA256: c5a058a1e3243ab7fd2c68c00448c0d1976b060e5a035a4195171a89189185fb
      DEPLOY_COORDINATION_MODULE_PATH: D:\DM\cicd-tools\iwork\ProductionCoordination.psm1
      DEPLOY_COORDINATION_MODULE_SHA256: 0f2e7346e32bcc3dd59195b607c0ade58d11e3ee264d16292e8e669a7f614bc7
      IWORK_RELEASE_MANIFEST_SIGNING_KEY_ID: ${{ vars.IWORK_RELEASE_MANIFEST_SIGNING_KEY_ID }}
      IWORK_RELEASE_MANIFEST_VERIFY_CERT_B64: ${{ secrets.IWORK_RELEASE_MANIFEST_VERIFY_CERT_B64 }}
    steps:
      - name: 显式生产准入
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') { throw 'Production deploy must use workflow_dispatch.' }
          if ($env:GITHUB_REPOSITORY -cne 'GuChenkano/iwork') { throw 'Production deploy repository is not approved.' }
          if ($env:GITHUB_ACTOR -cne 'GuChenkano') { throw 'Production deploy actor is not approved.' }
          if ($env:GITHUB_REF -cne 'refs/heads/Keycloak') { throw 'Production deploy ref is not approved.' }
          if ($env:EXPECTED_REVISION -notmatch '^[0-9a-f]{40}$') { throw 'Invalid OCI revision format.' }
          if ($env:RUN_MIGRATIONS -eq 'true') { throw 'run_migrations=true is disabled until a machine-verifiable backward-compatible migration proof exists.' }
          foreach ($pair in @(
              @('REQUEST_ID', $env:REQUEST_ID),
              @('RELEASE_REQUEST_ID', $env:RELEASE_REQUEST_ID),
              @('IMAGE_DIGEST', $env:IMAGE_DIGEST),
              @('CONFIG_DIGEST', $env:CONFIG_DIGEST),
              @('CONFIG_ARTIFACT_DIGEST', $env:CONFIG_ARTIFACT_DIGEST),
              @('MANIFEST_ARTIFACT_DIGEST', $env:MANIFEST_ARTIFACT_DIGEST)
          )) {
              if ($pair[0] -like '*REQUEST_ID' -and $pair[1] -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') { throw "Invalid $($pair[0])." }
              if ($pair[0] -like '*DIGEST' -and $pair[1] -notmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid $($pair[0])." }
          }
          foreach ($pair in @(
              @('RELEASE_RUN_ID', $env:RELEASE_RUN_ID),
              @('RELEASE_RUN_ATTEMPT', $env:RELEASE_RUN_ATTEMPT),
              @('CONFIG_ARTIFACT_ID', $env:CONFIG_ARTIFACT_ID),
              @('MANIFEST_ARTIFACT_ID', $env:MANIFEST_ARTIFACT_ID)
          )) {
              if ($pair[1] -notmatch '^[0-9]+$') { throw "Invalid $($pair[0])." }
          }
          if ($env:RELEASE_RUN_ATTEMPT -notmatch '^[1-9][0-9]*$') { throw 'Invalid RELEASE_RUN_ATTEMPT.' }
          if ($env:CONFIG_ARTIFACT_NAME -cne "iwork-production-config-$env:EXPECTED_REVISION") { throw 'Config artifact name is not bound to the approved revision.' }
          if ($env:MANIFEST_ARTIFACT_NAME -cne "iwork-release-manifest-$env:EXPECTED_REVISION") { throw 'Manifest artifact name is not bound to the approved revision.' }
          if ($env:APPLY -eq 'true' -and ($env:PREFLIGHT_RUN_ID -eq 'none' -or $env:PREFLIGHT_REQUEST_ID -eq 'none')) { throw 'Deploy mode requires a successful apply=false preflight run.' }
          if ($env:APPLY -ne 'true' -and ($env:PREFLIGHT_RUN_ID -ne 'none' -or $env:PREFLIGHT_REQUEST_ID -ne 'none')) { throw 'Preflight mode must not bind a previous preflight run.' }
          if ($env:APPLY -eq 'true' -and $env:GITHUB_RUN_ATTEMPT -ne '1') {
              throw 'apply=true deployment re-run is forbidden; obtain fresh confirmation and dispatch a new run.'
          }

      - name: 解析指定Release Run与双Artifact
        id: release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') {
              throw 'Production deploy must use workflow_dispatch.'
          }
          if ($env:GITHUB_ACTOR -cne 'GuChenkano') {
              throw 'Production deploy actor is not approved.'
          }
          if ($env:EXPECTED_REVISION -notmatch '^[0-9a-f]{40}$') {
              throw 'Invalid OCI revision format.'
          }
          if ($env:REQUEST_ID -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') {
              throw 'Invalid request ID format.'
          }
          if ($env:RELEASE_REQUEST_ID -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') {
              throw 'Invalid release request ID format.'
          }
          if ($env:CONFIG_ARTIFACT_DIGEST -notmatch '^sha256:[0-9a-f]{64}$') {
              throw 'Invalid production config artifact digest format.'
          }
          $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          function Get-ExactRequestId {
              param([AllowNull()][string]$Title)
              $matches = [Regex]::Matches(
                  [string]$Title,
                  '(?i)(?<![0-9a-f])(?<request>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?![0-9a-f])'
              )
              if ($matches.Count -ne 1) {
                  return $null
              }
              return $matches[0].Groups['request'].Value.ToLowerInvariant()
          }
          $hasPreflight = (
              $env:APPLY -eq 'true' -and
              $env:PREFLIGHT_RUN_ID -ne 'none' -and
              $env:PREFLIGHT_REQUEST_ID -ne 'none'
          )
          if ($env:APPLY -eq 'true' -and -not $hasPreflight) {
              throw 'Deploy mode requires a successful apply=false preflight run.'
          }
          if ($env:APPLY -ne 'true' -and ($env:PREFLIGHT_RUN_ID -ne 'none' -or $env:PREFLIGHT_REQUEST_ID -ne 'none')) {
              throw 'Preflight mode must not bind a previous preflight run.'
          }
          if ($hasPreflight) {
              if ($env:PREFLIGHT_RUN_ID -notmatch '^[0-9]+-[1-9][0-9]*$') {
                  throw 'Invalid preflight run identifier.'
              }
              if ($env:PREFLIGHT_REQUEST_ID -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') {
                  throw 'Invalid preflight request ID.'
              }
              $preflightMatch = [Regex]::Match($env:PREFLIGHT_RUN_ID, '^(?<id>[0-9]+)-(?<attempt>[1-9][0-9]*)$')
              $preflightUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($preflightMatch.Groups['id'].Value)"
              $preflightDetails = Invoke-RestMethod `
                  -UseBasicParsing `
                  -Uri $preflightUri `
                  -Headers $headers `
                  -Method Get `
                  -TimeoutSec 30
              if (
                  $preflightDetails.status -ne 'completed' -or
                  $preflightDetails.conclusion -ne 'success' -or
                  $preflightDetails.event -ne 'workflow_dispatch' -or
                   [string]$preflightDetails.path -cne '.github/workflows/deploy-iwork.yml' -or
                   $preflightDetails.head_branch -ne 'Keycloak' -or
                   $preflightDetails.head_sha -cne $env:EXPECTED_REVISION -or
                   [string]$preflightDetails.run_attempt -cne $preflightMatch.Groups['attempt'].Value -or
                   [string]$preflightDetails.display_title -notmatch '(?i)\bpreflight\b' -or
                   (Get-ExactRequestId -Title ([string]$preflightDetails.display_title)) -cne $env:PREFLIGHT_REQUEST_ID.ToLowerInvariant()
              ) {
                  throw 'Bound preflight run is not a successful matching deploy workflow_dispatch run.'
              }
          }
          if ($env:RELEASE_RUN_ID -notmatch '^[0-9]+$' -or $env:RELEASE_RUN_ATTEMPT -notmatch '^[1-9][0-9]*$') {
              throw 'Release run identifier has an invalid format.'
          }
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RELEASE_RUN_ID"
          $releaseRun = Invoke-RestMethod -UseBasicParsing -Uri $releaseUri -Headers $headers -Method Get -TimeoutSec 30
          if (
              $releaseRun.status -ne 'completed' -or
              $releaseRun.conclusion -ne 'success' -or
              $releaseRun.event -ne 'workflow_dispatch' -or
              [string]$releaseRun.path -cne '.github/workflows/release.yml' -or
              $releaseRun.head_branch -ne 'Keycloak' -or
              $releaseRun.head_sha -cne $env:EXPECTED_REVISION -or
              [string]$releaseRun.run_attempt -cne $env:RELEASE_RUN_ATTEMPT -or
               (Get-ExactRequestId -Title ([string]$releaseRun.display_title)) -cne $env:RELEASE_REQUEST_ID.ToLowerInvariant()
          ) {
              throw 'Specified release run is not a successful workflow_dispatch for the approved commit and request ID.'
          }
          $artifactUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RELEASE_RUN_ID/artifacts?per_page=100"
          $artifactResponse = Invoke-RestMethod -UseBasicParsing -Uri $artifactUri -Headers $headers -Method Get -TimeoutSec 30
          $matchingConfigArtifacts = @($artifactResponse.artifacts | Where-Object {
              [string]$_.id -eq $env:CONFIG_ARTIFACT_ID -and
              $_.name -ceq $env:CONFIG_ARTIFACT_NAME -and
              -not $_.expired -and
              $_.digest -ceq $env:CONFIG_ARTIFACT_DIGEST
          })
          $matchingManifestArtifacts = @($artifactResponse.artifacts | Where-Object {
              [string]$_.id -eq $env:MANIFEST_ARTIFACT_ID -and
              $_.name -ceq $env:MANIFEST_ARTIFACT_NAME -and
              -not $_.expired -and
              $_.digest -ceq $env:MANIFEST_ARTIFACT_DIGEST
          })
          if ($matchingConfigArtifacts.Count -ne 1 -or $matchingManifestArtifacts.Count -ne 1) {
              throw 'Specified release artifacts are not unique or do not match the supplied metadata.'
          }
          if ([string]$matchingConfigArtifacts[0].id -ceq [string]$matchingManifestArtifacts[0].id) {
              throw 'Config and manifest artifacts must be distinct.'
          }
          $manifestArtifactUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:MANIFEST_ARTIFACT_ID"
          try {
              $manifestArtifactMetadata = Invoke-RestMethod -UseBasicParsing -Uri $manifestArtifactUri -Headers $headers -Method Get -TimeoutSec 30
          }
          catch {
              throw 'Independent manifest artifact metadata lookup failed.'
          }
          if (
              [string]$manifestArtifactMetadata.id -cne $env:MANIFEST_ARTIFACT_ID -or
              [string]$manifestArtifactMetadata.name -cne $env:MANIFEST_ARTIFACT_NAME -or
              [bool]$manifestArtifactMetadata.expired -or
              [string]$manifestArtifactMetadata.digest -cne $env:MANIFEST_ARTIFACT_DIGEST -or
              [string]$manifestArtifactMetadata.workflow_run.id -cne $env:RELEASE_RUN_ID -or
              [int64]$manifestArtifactMetadata.size_in_bytes -le 0 -or
              [string]::IsNullOrWhiteSpace([string]$manifestArtifactMetadata.created_at)
          ) {
              throw 'Independent manifest artifact metadata does not match the specified release.'
          }
           "run_id=$($releaseRun.id)" >> $env:GITHUB_OUTPUT
           "release_url=$($releaseRun.html_url)" >> $env:GITHUB_OUTPUT
           "config_artifact_id=$env:CONFIG_ARTIFACT_ID" >> $env:GITHUB_OUTPUT
           "manifest_artifact_id=$env:MANIFEST_ARTIFACT_ID" >> $env:GITHUB_OUTPUT

      - name: 校验候选镜像并执行预检或部署
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          chcp 65001 | Out-Null

          function Get-VerifiedReleaseManifest {
              param(
                  [Parameter(Mandatory = $true)][string]$ManifestRoot
              )
              if (-not (Test-Path -LiteralPath $ManifestRoot -PathType Container)) {
                  throw 'Release manifest directory is missing.'
              }
              $manifestEntries = @(Get-ChildItem -LiteralPath $ManifestRoot -Force -Recurse -File)
              $manifestDirectories = @(Get-ChildItem -LiteralPath $ManifestRoot -Force -Recurse -Directory)
              if (
                  $manifestEntries.Count -ne 2 -or
                  $manifestDirectories.Count -ne 0 -or
                  (@($manifestEntries.Name) -notcontains 'release-manifest.json') -or
                  (@($manifestEntries.Name) -notcontains 'release-manifest.sig')
              ) {
                  throw 'Release manifest bundle must contain exactly the JSON and signature files.'
              }
              $releaseManifestPath = ($manifestEntries | Where-Object { $_.Name -ceq 'release-manifest.json' }).FullName
              $releaseManifestSignaturePath = ($manifestEntries | Where-Object { $_.Name -ceq 'release-manifest.sig' }).FullName
              try {
                  $manifestBytes = [IO.File]::ReadAllBytes($releaseManifestPath)
                  $signatureText = ([IO.File]::ReadAllText($releaseManifestSignaturePath, [Text.UTF8Encoding]::new($false))).Trim()
                  $signatureBytes = [Convert]::FromBase64String($signatureText)
              }
              catch {
                  throw 'Release manifest signature file is not valid base64.'
              }
              if ($env:IWORK_RELEASE_MANIFEST_SIGNING_KEY_ID -notmatch '^[A-Za-z0-9._-]{1,128}$') {
                  throw 'Manifest signing key ID is not configured.'
              }
              if ([String]::IsNullOrWhiteSpace($env:IWORK_RELEASE_MANIFEST_VERIFY_CERT_B64)) {
                  throw 'Manifest verification certificate is not configured.'
              }
              $certificate = $null
              $publicKey = $null
              try {
                  $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                      [Convert]::FromBase64String($env:IWORK_RELEASE_MANIFEST_VERIFY_CERT_B64)
                  )
                  $publicKey = $certificate.PublicKey.Key
                  if ($null -eq $publicKey -or -not $publicKey.VerifyData($manifestBytes, 'SHA256', $signatureBytes)) {
                      throw 'signature mismatch'
                  }
              }
              catch {
                  throw 'Manifest signature verification failed.'
              }
              finally {
                  if ($null -ne $publicKey -and $publicKey -is [IDisposable]) { $publicKey.Dispose() }
                  if ($null -ne $certificate) { $certificate.Dispose() }
              }
              try {
                  $releaseManifest = Get-Content -LiteralPath $releaseManifestPath -Raw | ConvertFrom-Json
              }
              catch {
                  throw 'Release manifest is not valid JSON.'
              }
              foreach ($field in @(
                  'ci_run_id', 'ci_run_attempt', 'ci_request_id', 'workflow', 'ref',
                  'mechanism_id', 'risk_envelope', 'migration_policy_id',
                  'signature_algorithm', 'signature_key_id'
              )) {
                  if (-not $releaseManifest.PSObject.Properties.Name.Contains($field)) {
                      throw "Release manifest field is missing: $field"
                  }
              }
              if ([string]$releaseManifest.ci_run_id -notmatch '^[0-9]+$' -or
                  [string]$releaseManifest.ci_run_attempt -notmatch '^[1-9][0-9]*$') {
                  throw 'Release manifest CI run identifiers have an invalid format.'
              }
              if ([string]$releaseManifest.ci_request_id -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') {
                  throw 'Release manifest CI request ID has an invalid format.'
              }
              if ([string]$releaseManifest.signature_algorithm -cne 'RSASSA-PKCS1-v1_5-SHA256' -or
                  [string]$releaseManifest.signature_key_id -cne $env:IWORK_RELEASE_MANIFEST_SIGNING_KEY_ID) {
                  throw 'Release manifest signature metadata does not match the approved key.'
              }
              $manifestChecks = @{
                  schema = 'iwork-release/v1'
                  repository = 'GuChenkano/iwork'
                  branch = 'Keycloak'
                  commit = $env:EXPECTED_REVISION
                  release_run_id = [long]$env:RELEASE_RUN_ID
                  release_run_attempt = [int]$env:RELEASE_RUN_ATTEMPT
                  release_request_id = $env:RELEASE_REQUEST_ID
                  image_digest = $env:IMAGE_DIGEST
                  config_digest = $env:CONFIG_DIGEST
                  config_artifact_name = $env:CONFIG_ARTIFACT_NAME
                  config_artifact_id = [long]$env:CONFIG_ARTIFACT_ID
                  config_artifact_digest = $env:CONFIG_ARTIFACT_DIGEST
                  workflow = '.github/workflows/release.yml'
                  ref = 'refs/heads/Keycloak'
                  mechanism_id = 'iwork-release-mechanism-v1'
                  risk_envelope = 'application-only'
                  migration_policy_id = 'disabled-v1'
              }
              foreach ($field in $manifestChecks.Keys) {
                  if ([string]$releaseManifest.$field -cne [string]$manifestChecks[$field]) {
                      throw "Release manifest field mismatch: $field"
                  }
              }
              if ([string]$releaseManifest.manifest_artifact_name -cne $env:MANIFEST_ARTIFACT_NAME) {
                  throw 'Release manifest name mismatch.'
              }
              return $releaseManifest
          }

          if ($env:IMAGE_DIGEST -notmatch '^sha256:[0-9a-f]{64}$') {
              throw 'Invalid image digest format.'
          }
          if ($env:CONFIG_DIGEST -notmatch '^sha256:[0-9a-f]{64}$') {
              throw 'Invalid production config digest format.'
          }
          if ($env:REQUEST_ID -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') {
              throw 'Invalid request ID format.'
          }
          if ($env:EXPECTED_REVISION -notmatch '^[0-9a-f]{40}$') {
              throw 'Invalid OCI revision format.'
          }
          if ($env:EXPECTED_REVISION -cne $env:GITHUB_SHA) {
              throw "Candidate revision is not the approved head: $env:EXPECTED_REVISION"
          }
          if ([String]::IsNullOrWhiteSpace($env:CHANGE_DESCRIPTION)) {
              throw 'Change description is required.'
          }
          if ($env:ROLLBACK_DRILL -eq 'true' -and $env:APPLY -ne 'true') {
              throw 'Rollback drill requires apply=true.'
          }
          if ($env:ROLLBACK_DRILL -eq 'true' -and $env:RUN_MIGRATIONS -eq 'true') {
              throw 'Rollback drill forbids database migrations.'
          }

          function Assert-SpecifiedWorkflowRun {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$WorkflowFile,

                  [Parameter(Mandatory = $true)]
                  [string]$Description,

                  [Parameter(Mandatory = $true)][long]$RunId,
                  [Parameter(Mandatory = $true)][int]$RunAttempt,
                  [Parameter(Mandatory = $true)][string]$ExpectedRequestId
              )
              $headers = @{
                  Authorization = "Bearer $env:GITHUB_TOKEN"
                  Accept = 'application/vnd.github+json'
                  'X-GitHub-Api-Version' = '2022-11-28'
              }
              try {
                  $run = Invoke-RestMethod `
                      -UseBasicParsing `
                      -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$RunId" `
                      -Headers $headers `
                      -Method Get `
                      -TimeoutSec 30
              }
              catch {
                  throw "$Description run lookup failed."
              }
              if (
                  $run.status -ne 'completed' -or
                  $run.conclusion -ne 'success' -or
                  $run.event -ne 'workflow_dispatch' -or
                  [string]$run.path -cne ".github/workflows/$WorkflowFile" -or
                  $run.head_branch -ne 'Keycloak' -or
                  $run.head_sha -cne $env:EXPECTED_REVISION -or
                  [int]$run.run_attempt -ne $RunAttempt -or
                   (Get-ExactRequestId -Title ([string]$run.display_title)) -cne $ExpectedRequestId.ToLowerInvariant()
              ) {
                  throw "No successful bound $Description run found for the approved revision."
              }
              return $run
          }

          $mode = if ($env:APPLY -eq 'true') { 'Deploy' } else { 'Preflight' }
          $expectedConfirmation = if ($env:ROLLBACK_DRILL -eq 'true') {
              'ROLLBACK DRILL IWORK ONCE'
          }
          elseif ($mode -eq 'Deploy') {
              'DEPLOY IWORK'
          }
          else {
              'PREFLIGHT IWORK'
          }
          if ($env:CONFIRMATION -cne $expectedConfirmation) {
              throw "Confirmation mismatch; expected: $expectedConfirmation"
          }

          if (-not (Test-Path -LiteralPath $env:DEPLOY_SCRIPT_PATH -PathType Leaf)) {
              throw "Pinned deployment script is missing: $env:DEPLOY_SCRIPT_PATH"
          }
          $actualScriptHash = (
              Get-FileHash -LiteralPath $env:DEPLOY_SCRIPT_PATH -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualScriptHash -cne $env:DEPLOY_SCRIPT_SHA256) {
              throw "Pinned deployment script SHA-256 mismatch: $actualScriptHash"
          }
          if (-not (Test-Path -LiteralPath $env:DEPLOY_COORDINATION_MODULE_PATH -PathType Leaf)) {
              throw "Pinned coordination module is missing: $env:DEPLOY_COORDINATION_MODULE_PATH"
          }
          $actualModuleHash = (
              Get-FileHash -LiteralPath $env:DEPLOY_COORDINATION_MODULE_PATH -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualModuleHash -cne $env:DEPLOY_COORDINATION_MODULE_SHA256) {
              throw "Pinned coordination module SHA-256 mismatch: $actualModuleHash"
          }

          $candidateImage = "ghcr.io/guchenkano/iwork@$env:IMAGE_DIGEST"
          $deploymentRunId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          function Assert-NoReparsePath {
              param([Parameter(Mandatory = $true)][string]$Path)
              $probe = [IO.Path]::GetFullPath($Path)
              while (-not (Test-Path -LiteralPath $probe)) {
                  $parent = [IO.Path]::GetDirectoryName($probe)
                   if ([String]::IsNullOrWhiteSpace($parent) -or $parent -eq $probe) { throw "Temporary path parent does not exist: $Path" }
                  $probe = $parent
              }
              while ($true) {
                  $item = Get-Item -LiteralPath $probe -Force
                   if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Temporary path contains a reparse point: $probe" }
                  if ($null -eq $item.Parent -or $item.Parent.FullName -eq $item.FullName) { break }
                  $probe = $item.Parent.FullName
              }
          }
          function Write-CleanupFailedReceipt {
              param([Parameter(Mandatory = $true)][string]$Path, [Parameter(Mandatory = $true)][string]$ErrorMessage)
              $receiptPath = Join-Path $env:RUNNER_TEMP "iwork-cleanup-failed-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
              try {
                  $payload = [ordered]@{
                      schema = 'iwork-cleanup-failed/v1'
                      status = 'cleanup_failed'
                      request_id = $env:REQUEST_ID
                      deployment_run_id = $deploymentRunId
                      path = $Path
                      error = $ErrorMessage
                      created_at = [DateTimeOffset]::UtcNow.ToString('o')
                  } | ConvertTo-Json -Depth 5
                  $stream = [IO.File]::Open($receiptPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
                  try {
                      $writer = [IO.StreamWriter]::new($stream, [Text.UTF8Encoding]::new($false))
                      try { $writer.Write($payload) } finally { $writer.Dispose() }
                  }
                  finally { $stream.Dispose() }
              }
               catch { Write-Warning "Unable to write cleanup_failed receipt: $receiptPath; $($_.Exception.Message)" }
               Write-Warning "Temporary credential/config cleanup failed: $Path; $ErrorMessage"
          }
          function Assert-ArtifactArchiveDigest {
              param(
                  [Parameter(Mandatory = $true)][long]$ArtifactId,
                  [Parameter(Mandatory = $true)][string]$ExpectedDigest,
                  [Parameter(Mandatory = $true)][string]$ArchivePath,
                  [Parameter(Mandatory = $true)][string]$Description
              )
              if ($ExpectedDigest -notmatch '^sha256:[0-9a-f]{64}$') {
                  throw "$Description digest format is invalid."
              }
              if (Test-Path -LiteralPath $ArchivePath) {
                  throw "$Description archive destination already exists."
              }
              Add-Type -AssemblyName System.Net.Http
              $apiHandler = [Net.Http.HttpClientHandler]::new()
              $apiHandler.AllowAutoRedirect = $false
              $blobHandler = [Net.Http.HttpClientHandler]::new()
              $blobHandler.AllowAutoRedirect = $false
              $apiClient = [Net.Http.HttpClient]::new($apiHandler)
              $blobClient = [Net.Http.HttpClient]::new($blobHandler)
              $temporaryPath = "$ArchivePath.download"
              try {
                  $currentUri = [Uri]("https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$ArtifactId/zip")
                  $client = $apiClient
                  $bytes = $null
                  for ($redirect = 0; $redirect -le 3; $redirect++) {
                      $request = [Net.Http.HttpRequestMessage]::new([Net.Http.HttpMethod]::Get, $currentUri)
                      if ($client -eq $apiClient) {
                          $request.Headers.Authorization = [Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $env:GITHUB_TOKEN)
                          $request.Headers.Accept.Add([Net.Http.Headers.MediaTypeWithQualityHeaderValue]::new('application/vnd.github+json'))
                          $request.Headers.Add('X-GitHub-Api-Version', '2022-11-28')
                      }
                      try {
                          $response = $client.SendAsync(
                              $request,
                              [Net.Http.HttpCompletionOption]::ResponseHeadersRead
                          ).GetAwaiter().GetResult()
                      }
                      finally {
                          $request.Dispose()
                      }
                      try {
                          $statusCode = [int]$response.StatusCode
                          if ($statusCode -eq 200) {
                              $bytes = $response.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
                              break
                          }
                          if ($statusCode -notin @(301, 302, 303, 307, 308)) {
                              throw "$Description archive download returned HTTP $statusCode."
                          }
                          $location = $response.Headers.Location
                          if ($null -eq $location -or -not $location.IsAbsoluteUri -or $location.Scheme -cne 'https') {
                              throw "$Description archive redirect is not a valid HTTPS URL."
                          }
                          if ($redirect -eq 3) {
                              throw "$Description archive redirect chain is too long."
                          }
                          $currentUri = $location
                          $client = $blobClient
                      }
                      finally {
                          $response.Dispose()
                      }
                  }
                  if ($null -eq $bytes -or $bytes.Length -le 0) {
                      throw "$Description archive download returned an empty body."
                  }
                  [IO.File]::WriteAllBytes($temporaryPath, $bytes)
                  [IO.File]::Move($temporaryPath, $ArchivePath)
              }
              catch {
                  throw "$Description archive download failed: $($_.Exception.Message)"
              }
              finally {
                  $apiClient.Dispose()
                  $blobClient.Dispose()
                  $apiHandler.Dispose()
                  $blobHandler.Dispose()
                  if (Test-Path -LiteralPath $temporaryPath) {
                      Remove-Item -LiteralPath $temporaryPath -Force -ErrorAction SilentlyContinue
                  }
              }
              if (-not (Test-Path -LiteralPath $ArchivePath -PathType Leaf)) {
                  throw "$Description archive is missing after download."
              }
              $actualDigest = (
                  Get-FileHash -LiteralPath $ArchivePath -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              if ("sha256:$actualDigest" -cne $ExpectedDigest) {
                  throw "$Description archive digest mismatch: sha256:$actualDigest"
              }
          }

          function Expand-VerifiedArtifactArchive {
              param(
                  [Parameter(Mandatory = $true)][string]$ArchivePath,
                  [Parameter(Mandatory = $true)][string]$DestinationPath,
                  [Parameter(Mandatory = $true)][string[]]$ExpectedFiles,
                  [Parameter(Mandatory = $true)][string]$Description
              )
              if (-not (Test-Path -LiteralPath $ArchivePath -PathType Leaf)) {
                  throw "$Description archive is missing before extraction."
              }
              if (Test-Path -LiteralPath $DestinationPath) {
                  throw "$Description extraction destination already exists."
              }
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $destinationFull = [IO.Path]::GetFullPath($DestinationPath).TrimEnd('\')
              $destinationPrefix = "$destinationFull\"
              $expectedSet = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
              foreach ($expectedFile in $ExpectedFiles) {
                  [void]$expectedSet.Add($expectedFile.Replace('\', '/'))
              }
              $allowedDirectories = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
              foreach ($expectedFile in $expectedSet) {
                  $parts = $expectedFile.Split('/')
                  for ($index = 1; $index -lt $parts.Length; $index++) {
                      [void]$allowedDirectories.Add(($parts[0..($index - 1)] -join '/'))
                  }
              }
              $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
              $zip = [IO.Compression.ZipFile]::OpenRead($ArchivePath)
              try {
                  foreach ($entry in $zip.Entries) {
                      $normalized = ([string]$entry.FullName).Replace('\', '/')
                      $isDirectory = $normalized.EndsWith('/')
                      $relative = $normalized.TrimEnd('/')
                      if ([String]::IsNullOrWhiteSpace($relative) -or
                          $relative.StartsWith('/') -or
                          $relative -match '^[A-Za-z]:/' -or
                          $relative -match '(^|/)\.\.?(/|$)' -or
                          $relative.Contains(':')) {
                          throw "$Description archive contains an unsafe path: $normalized"
                      }
                      if (-not $seen.Add($relative)) {
                          throw "$Description archive contains a duplicate path: $relative"
                      }
                      if ($isDirectory) {
                          if (-not $allowedDirectories.Contains($relative)) {
                              throw "$Description archive contains an unexpected directory: $relative"
                          }
                          continue
                      }
                      if (-not $expectedSet.Contains($relative)) {
                          throw "$Description archive contains an unexpected file: $relative"
                      }
                      $unixMode = (([int64]$entry.ExternalAttributes -shr 16) -band 0xF000)
                      if ($unixMode -eq 0xA000) {
                          throw "$Description archive contains a symbolic link: $relative"
                      }
                      $targetPath = [IO.Path]::GetFullPath(
                          (Join-Path $DestinationPath ($relative.Replace('/', '\')))
                      )
                      if (-not $targetPath.StartsWith($destinationPrefix, [StringComparison]::OrdinalIgnoreCase)) {
                          throw "$Description archive path escapes its destination: $relative"
                      }
                      $parent = [IO.Path]::GetDirectoryName($targetPath)
                      [IO.Directory]::CreateDirectory($parent) | Out-Null
                      $input = $entry.Open()
                      try {
                          $output = [IO.File]::Open(
                              $targetPath,
                              [IO.FileMode]::CreateNew,
                              [IO.FileAccess]::Write,
                              [IO.FileShare]::None
                          )
                          try { $input.CopyTo($output) } finally { $output.Dispose() }
                      }
                      finally { $input.Dispose() }
                  }
              }
              finally {
                  $zip.Dispose()
              }
              $actualFiles = @(Get-ChildItem -LiteralPath $DestinationPath -Force -Recurse -File | ForEach-Object {
                  $_.FullName.Substring($destinationFull.Length).TrimStart('\', '/').Replace('\', '/')
              })
              if (($actualFiles | Sort-Object) -cne ($expectedSet | Sort-Object)) {
                  throw "$Description extracted file set does not match the expected contract."
              }
              foreach ($item in @(Get-ChildItem -LiteralPath $DestinationPath -Force -Recurse)) {
                  if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                      throw "$Description extraction contains a reparse point: $($item.FullName)"
                  }
              }
              Assert-NoReparsePath -Path $DestinationPath
          }
          $cleanupErrors = @()
          $deploymentError = $null
          $configArchivePath = Join-Path `
              $env:RUNNER_TEMP `
              "iwork-config-artifact-$env:CONFIG_ARTIFACT_ID.zip"
          $manifestArchivePath = Join-Path `
              $env:RUNNER_TEMP `
              "iwork-manifest-artifact-$env:MANIFEST_ARTIFACT_ID.zip"
          $releaseManifestRoot = Join-Path $env:RUNNER_TEMP 'iwork-release-manifest'
          $cleanupPaths = @(
              $env:CONFIG_BUNDLE_PATH,
              $releaseManifestRoot,
              $configArchivePath,
              $manifestArchivePath
          )
          try {
              $env:DOCKER_CONFIG = Join-Path `
                  $env:RUNNER_TEMP `
                  "iwork-deploy-docker-config-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
              $cleanupPaths = @(
                  $env:DOCKER_CONFIG,
                  $env:CONFIG_BUNDLE_PATH,
                  $releaseManifestRoot,
                  $configArchivePath,
                  $manifestArchivePath
              )
              Assert-NoReparsePath -Path $env:RUNNER_TEMP
              Assert-NoReparsePath -Path $env:DOCKER_CONFIG
              Assert-NoReparsePath -Path $env:CONFIG_BUNDLE_PATH
              Assert-NoReparsePath -Path $releaseManifestRoot
              Assert-NoReparsePath -Path $configArchivePath
              Assert-NoReparsePath -Path $manifestArchivePath
              New-Item -ItemType Directory -Path $env:DOCKER_CONFIG -Force | Out-Null
              $basicValue = "$env:GITHUB_ACTOR`:$env:GITHUB_TOKEN"
              $encodedAuth = [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes($basicValue)
              )
              $dockerConfig = @{
                  auths = @{
                      'ghcr.io' = @{ auth = $encodedAuth }
                  }
              } | ConvertTo-Json -Depth 4 -Compress
              [IO.File]::WriteAllText(
                  (Join-Path $env:DOCKER_CONFIG 'config.json'),
                  $dockerConfig,
                  [Text.UTF8Encoding]::new($false)
              )

              Assert-ArtifactArchiveDigest `
                  -ArtifactId ([long]$env:CONFIG_ARTIFACT_ID) `
                  -ExpectedDigest $env:CONFIG_ARTIFACT_DIGEST `
                  -ArchivePath $configArchivePath `
                  -Description 'Config artifact'
              Assert-ArtifactArchiveDigest `
                  -ArtifactId ([long]$env:MANIFEST_ARTIFACT_ID) `
                  -ExpectedDigest $env:MANIFEST_ARTIFACT_DIGEST `
                  -ArchivePath $manifestArchivePath `
                  -Description 'Manifest artifact'
              Expand-VerifiedArtifactArchive `
                  -ArchivePath $configArchivePath `
                  -DestinationPath $env:CONFIG_BUNDLE_PATH `
                  -ExpectedFiles @('config-manifest.json', 'docker-compose.yml', 'env/production.env') `
                  -Description 'Config artifact'
              Expand-VerifiedArtifactArchive `
                  -ArchivePath $manifestArchivePath `
                  -DestinationPath $releaseManifestRoot `
                  -ExpectedFiles @('release-manifest.json', 'release-manifest.sig') `
                  -Description 'Manifest artifact'
              $releaseManifest = Get-VerifiedReleaseManifest -ManifestRoot $releaseManifestRoot

              # Read CI/Release bindings and config only after archive digests,
              # safe extraction, and manifest signature verification succeed.
              # A clean runner or stale directory must never provide evidence.
              $ciRun = Assert-SpecifiedWorkflowRun `
                  -WorkflowFile 'ci.yml' `
                  -Description 'CI' `
                  -RunId ([long]$releaseManifest.ci_run_id) `
                  -RunAttempt ([int]$releaseManifest.ci_run_attempt) `
                  -ExpectedRequestId ([string]$releaseManifest.ci_request_id)
              $releaseRun = Assert-SpecifiedWorkflowRun `
                  -WorkflowFile 'release.yml' `
                  -Description 'GHCR release' `
                  -RunId ([long]$env:RELEASE_RUN_ID) `
                  -RunAttempt ([int]$env:RELEASE_RUN_ATTEMPT) `
                  -ExpectedRequestId $env:RELEASE_REQUEST_ID

              $manifestPath = Join-Path $env:CONFIG_BUNDLE_PATH 'config-manifest.json'
              $composePath = Join-Path $env:CONFIG_BUNDLE_PATH 'docker-compose.yml'
              $profilePath = Join-Path $env:CONFIG_BUNDLE_PATH 'env/production.env'
              foreach ($requiredPath in @($manifestPath, $composePath, $profilePath)) {
                  if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                      throw "Production config bundle file is missing: $requiredPath"
                  }
              }
              $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
              if ($manifest.schema -cne 'iwork-production-config/v1') {
                  throw 'Production config schema mismatch.'
              }
              if ($manifest.source_commit -cne $env:EXPECTED_REVISION) {
                  throw 'Production config commit mismatch.'
              }
              if ($manifest.image_digest -cne $env:IMAGE_DIGEST) {
                  throw 'Production config image digest mismatch.'
              }
              if ($manifest.config_digest -cne $env:CONFIG_DIGEST) {
                  throw 'Production config digest mismatch.'
              }
              $composeHash = (
                  Get-FileHash -LiteralPath $composePath -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              $profileHash = (
                  Get-FileHash -LiteralPath $profilePath -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              if ($composeHash -cne $manifest.compose_sha256) {
                  throw 'Production compose hash mismatch.'
              }
              if ($profileHash -cne $manifest.production_env_sha256) {
                  throw 'Production profile hash mismatch.'
              }
              "IWORK_CONFIG_ARTIFACT_ARCHIVE_VERIFIED=true"
              "IWORK_RELEASE_MANIFEST_ARCHIVE_VERIFIED=true"

              docker pull $candidateImage
              if ($LASTEXITCODE -ne 0) {
                  throw 'Candidate GHCR image pull failed.'
              }
              $labelsJson = docker image inspect `
                  $candidateImage `
                  --format '{{json .Config.Labels}}'
              if ($LASTEXITCODE -ne 0) {
                  throw 'Candidate OCI label inspection failed.'
              }
              $labels = $labelsJson | ConvertFrom-Json
              $actualRevision = [string]$labels.'org.opencontainers.image.revision'
              $actualSource = [string]$labels.'org.opencontainers.image.source'
              if ($actualRevision -cne $env:EXPECTED_REVISION) {
                  throw "Candidate OCI revision mismatch: $actualRevision"
              }
              if ($actualSource -cne "https://github.com/$env:GITHUB_REPOSITORY") {
                  throw 'Candidate OCI source label mismatch.'
              }

              $summary = & $env:DEPLOY_SCRIPT_PATH `
                  -Mode $mode `
                  -ImageDigest $env:IMAGE_DIGEST `
                  -ExpectedRevision $env:EXPECTED_REVISION `
                   -ConfigDigest $env:CONFIG_DIGEST `
                   -ConfigArtifactDigest $env:CONFIG_ARTIFACT_DIGEST `
                   -ConfigBundlePath $env:CONFIG_BUNDLE_PATH `
                   -PreflightRunId $env:PREFLIGHT_RUN_ID `
                   -PreflightRequestId $env:PREFLIGHT_REQUEST_ID `
                   -RequestId $env:REQUEST_ID `
                  -RunId $deploymentRunId `
                  -Actor $env:GITHUB_ACTOR `
                  -ChangeDescription $env:CHANGE_DESCRIPTION `
                  -WatchdogSha256 $env:WATCHDOG_SHA256 `
                  -WatchdogManifestPath $env:WATCHDOG_MANIFEST_PATH `
                  -WatchdogManifestSha256 $env:WATCHDOG_MANIFEST_SHA256 `
                  -WatchdogTaskName $env:WATCHDOG_TASK_NAME `
                  -WatchdogTaskPath $env:WATCHDOG_TASK_PATH `
                  -ExternalProbeReceiptPath $env:EXTERNAL_PROBE_RECEIPT_PATH `
                  -RunMigrations $env:RUN_MIGRATIONS `
                  -RollbackDrill $env:ROLLBACK_DRILL
              if ($LASTEXITCODE -ne 0) {
                  throw "Pinned deployment script failed; exit=$LASTEXITCODE"
              }

              $result = ($summary -join "`n") | ConvertFrom-Json
              "IWORK_IMAGE_DIGEST=$env:IMAGE_DIGEST"
              "IWORK_CONFIG_DIGEST=$env:CONFIG_DIGEST"
              "IWORK_CONFIG_ARTIFACT_DIGEST=$env:CONFIG_ARTIFACT_DIGEST"
              "IWORK_REQUEST_ID=$env:REQUEST_ID"
              "IWORK_RELEASE_REQUEST_ID=$env:RELEASE_REQUEST_ID"
              @(
                  '## iwork production deployment result'
                  ''
                  "- Mode: $mode"
                  "- Image: $candidateImage"
                  "- Config digest: $env:CONFIG_DIGEST"
                  "- Config artifact digest: $env:CONFIG_ARTIFACT_DIGEST"
                  "- Config bundle: ``$($result.ConfigBundlePath)``"
                  "- Compose SHA-256: ``$($result.ComposeSha256)``"
                   "- Production env SHA-256: ``$($result.ProductionEnvSha256)``"
                   "- OCI revision: $env:EXPECTED_REVISION"
                   "- Preflight Run: ``$env:PREFLIGHT_RUN_ID``"
                   "- Preflight request ID: ``$env:PREFLIGHT_REQUEST_ID``"
                  "- Run migrations: $env:RUN_MIGRATIONS"
                  "- Rollback drill: $env:ROLLBACK_DRILL"
                  "- Deployment ID: ``$deploymentRunId``"
                   "- Request ID: ``$env:REQUEST_ID``"
                   "- Release request ID: ``$env:RELEASE_REQUEST_ID``"
                  "- Previous web image ID: ``$($result.PreviousWebImageId)``"
                  "- Previous alert worker image ID: ``$($result.PreviousAlertWorkerImageId)``"
                  "- Duration: $($result.DurationSeconds) seconds"
                  "- Result: ``$($result.Result)``"
                  "- State file: ``$($result.StateFile)``"
              ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }
          catch {
              $stateFile = "D:\DM\cicd-state\iwork\$deploymentRunId.json"
              $failureSummary = @(
                  '## iwork production deployment failed'
                  ''
                  "- Mode: $mode"
                  "- Image: $candidateImage"
                  "- OCI revision: $env:EXPECTED_REVISION"
                  "- Rollback drill: $env:ROLLBACK_DRILL"
                   "- Deployment ID: ``$deploymentRunId``"
                   "- Request ID: ``$env:REQUEST_ID``"
                   "- Release request ID: ``$env:RELEASE_REQUEST_ID``"
              )
              if (Test-Path -LiteralPath $stateFile -PathType Leaf) {
                  $failureState = Get-Content -LiteralPath $stateFile -Raw |
                      ConvertFrom-Json
                  $failureSummary += @(
                      "- Status: ``$($failureState.Status)``"
                      "- Previous web image ID: ``$($failureState.PreviousWebImageId)``"
                      "- Previous alert worker image ID: ``$($failureState.PreviousAlertWorkerImageId)``"
                      "- Rollback succeeded: $($failureState.RollbackSucceeded)"
                      "- State file: ``$stateFile``"
                  )
              }
              else {
                  $failureSummary += '- Status: failed before the server script created a state file'
              }
              $failureSummary |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
              $deploymentError = $_
          }
          finally {
              foreach ($cleanupPath in $cleanupPaths) {
                  if ([String]::IsNullOrWhiteSpace([string]$cleanupPath)) { continue }
                  if (Test-Path -LiteralPath $cleanupPath) {
                      try { Remove-Item -LiteralPath $cleanupPath -Recurse -Force -ErrorAction Stop }
                      catch {
                          $cleanupErrors += $_.Exception.Message
                          Write-CleanupFailedReceipt -Path $cleanupPath -ErrorMessage $_.Exception.Message
                      }
                  }
              }
              Remove-Variable basicValue, encodedAuth, dockerConfig -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath Env:DOCKER_CONFIG -ErrorAction SilentlyContinue
          }
          if ($null -ne $deploymentError) { throw $deploymentError }
          if ($cleanupErrors.Count -gt 0) {
              throw "Production temporary file cleanup failed: $($cleanupErrors -join '; ')"
          }
